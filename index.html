<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sajan Bhandari — Programmer</title>
  <meta name="description" content="Portfolio of Sajan Bhandari, a programmer building things for the web.">
  <meta name="theme-color" content="#14110f">
  <link rel="icon" href="assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <header class="nav" id="nav">
    <a class="brand" href="#top" id="brand">SB</a>
    <nav aria-label="Primary">
      <a href="#about">About</a>
      <a href="#work">Work</a>
      <a href="#experience">Experience</a>
      <a href="#contact">Contact</a>
    </nav>
    <button class="theme" id="theme" aria-label="Toggle colour theme" type="button"></button>
  </header>

  <main id="top">
    <section class="hero">
      <p class="pill" id="availability"><span class="dot"></span><span></span></p>
      <h1 id="name">&nbsp;</h1>
      <p class="role" id="role"></p>
      <p class="tagline" id="tagline"></p>
      <div class="cta">
        <a class="btn primary" href="#work">See my work</a>
        <a class="btn" href="#contact">Get in touch</a>
      </div>
      <figure class="avatar" id="avatar" hidden></figure>
    </section>

    <section id="about" class="block reveal">
      <h2 class="eyebrow">About</h2>
      <div class="about">
        <p class="lead" id="about-heading"></p>
        <div id="about-body"></div>
      </div>
      <div class="skills" id="skills"></div>
    </section>

    <section id="work" class="block reveal">
      <h2 class="eyebrow">Selected work</h2>
      <div class="projects" id="projects"></div>
    </section>

    <section id="experience" class="block reveal">
      <h2 class="eyebrow">Experience</h2>
      <ol class="timeline" id="experience-list"></ol>
    </section>

    <section id="contact" class="block contact reveal">
      <h2 class="eyebrow">Contact</h2>
      <p class="lead">Have a project in mind? Let's talk.</p>
      <a class="mail" id="mail" href="#"></a>
      <ul class="socials" id="socials"></ul>
    </section>
  </main>

  <footer class="foot">
    <span id="copy"></span>
    <a href="admin/">Admin</a>
  </footer>

  <noscript><p class="noscript">Please enable JavaScript to view this portfolio.</p></noscript>
  <script src="js/main.js"></script>
</body>
</html>
